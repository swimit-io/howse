name: Bug report
description: Tell us what went wrong and how to reproduce it.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: This issue will be public. Remove tokens, private conversations, and private project content before you post.
  - type: input
    id: app-version
    attributes:
      label: Howse version
      placeholder: Shown in the sidebar's version line, e.g. 0.10.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and agent CLI versions
      placeholder: e.g. macOS 26.1 (Apple silicon) or Windows 11 (x64), Claude Code CLI 2.1.260
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the steps that led to the problem, in order.
    validations:
      required: true
  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs. actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional context
      description: Attach error messages or screenshots, with any sensitive content removed.
